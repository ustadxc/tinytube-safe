<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZeynepsGarden">
<meta name="theme-color" content="#5b21b6">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ZeynepsGarden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<style>
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
body{background:linear-gradient(165deg,#5b21b6,#db2777 65%,#f59e0b);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.btn{transition:transform .1s}.btn:active{transform:scale(.92)}
#player{pointer-events:none}
body{height:100vh;height:100dvh;overflow:hidden}
.inU{animation:inU .3s ease-out}.inD{animation:inD .3s ease-out}
@keyframes inU{from{transform:translateY(70px);opacity:.2}}
@keyframes inD{from{transform:translateY(-70px);opacity:.2}}
#list::-webkit-scrollbar{display:none}
#chips::-webkit-scrollbar{display:none}
</style>
</head>
<body class="font-sans text-slate-800">

<div id="app" class="h-full max-w-2xl mx-auto flex flex-col">
  <section id="stage" class="relative flex-1 min-h-0 bg-black overflow-hidden rounded-b-3xl shadow-2xl">
    <div id="pbox" class="absolute inset-0"><div id="player" class="absolute inset-0 w-full h-full"></div></div>
    <!-- click-shield + swipe zone: swipe up/left = next, down/right = previous, tap = play/pause -->
    <div id="shield" class="absolute inset-0 z-10 flex items-center justify-center" style="touch-action:none">
      <span id="bigPlay" class="text-7xl drop-shadow-lg transition-opacity">▶️</span>
    </div>
    <button id="lockBtn" class="btn absolute top-3 right-3 z-20 bg-black/30 text-white rounded-full w-10 h-10 text-lg" aria-label="Parent mode">🔒</button>
    <p id="msg" class="absolute inset-x-0 bottom-3 z-20 px-3 text-yellow-200 text-xs font-semibold text-center pointer-events-none"></p>
    <div class="absolute inset-x-0 bottom-0 z-20 h-1 bg-white/20 pointer-events-none"><div id="bar" class="h-full bg-yellow-300" style="width:0"></div></div>
  </section>
  <section class="shrink-0 h-[20%] min-h-[9.5rem] flex flex-col pt-2">
    <div class="flex items-center gap-2 px-3 pb-2"><span class="shrink-0 text-white font-extrabold">🎈 ZeynepsGarden</span><nav id="chips" class="flex gap-2 overflow-x-auto flex-1"></nav></div>
    <main id="list" class="flex-1 min-h-0 flex gap-3 overflow-x-auto px-3 pb-2 items-start" style="scroll-snap-type:x proximity"></main>
  </section>
</div>

<!-- Parent gate -->
<div id="gate" class="fixed inset-0 z-40 bg-black/70 hidden items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-5 w-full max-w-xs text-center">
    <h2 class="font-extrabold text-xl">Grown-ups only 🔐</h2>
    <p id="gq" class="mt-1 text-slate-600"></p>
    <div id="gd" class="h-12 my-2 text-3xl font-bold tracking-widest leading-[3rem]"></div>
    <div id="pad" class="grid grid-cols-3 gap-2"></div>
    <button id="gx" class="mt-3 text-slate-500 underline">Cancel</button>
  </div>
</div>

<!-- Parent sidebar -->
<aside id="panel" class="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-slate-50 shadow-2xl translate-x-full transition-transform duration-300 flex flex-col" style="padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)">
  <div class="flex items-center justify-between p-4 bg-violet-700 text-white">
    <h2 class="font-extrabold text-lg">Parent Zone</h2>
    <button id="lockOut" class="btn bg-white/20 rounded-full px-4 py-1 font-bold">🔒 Lock</button>
  </div>
  <div class="flex-1 overflow-y-auto p-4 space-y-6">
    <section>
      <h3 class="font-bold mb-1">Add videos</h3>
      <textarea id="addTxt" rows="3" placeholder="Paste YouTube or Shorts links, one per line" class="w-full border rounded-xl p-2 text-base"></textarea>
      <button id="addBtn" class="btn mt-2 w-full bg-emerald-500 text-white font-bold rounded-xl py-2">Add to this playlist</button>
      <p id="addMsg" class="text-sm text-slate-500 mt-1"></p>
    </section>
    <section>
      <h3 class="font-bold mb-1">Playlists</h3>
      <select id="plSel" class="w-full border rounded-xl p-2 text-base bg-white"></select>
      <div class="grid grid-cols-3 gap-2 mt-2 text-sm font-bold">
        <button id="plNew" class="btn bg-sky-500 text-white rounded-xl py-2">New</button>
        <button id="plRen" class="btn bg-amber-500 text-white rounded-xl py-2">Rename</button>
        <button id="plDel" class="btn bg-rose-500 text-white rounded-xl py-2">Delete</button>
      </div>
    </section>
    <section>
      <h3 class="font-bold mb-1">Videos in this playlist</h3>
      <div id="vlist" class="space-y-2"></div>
    </section>
    <section>
      <h3 class="font-bold mb-1">Security</h3>
      <p id="pinState" class="text-sm text-slate-500 mb-2"></p>
      <input id="pinIn" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN" class="w-full border rounded-xl p-2 text-base">
      <div class="grid grid-cols-2 gap-2 mt-2 text-sm font-bold">
        <button id="pinSave" class="btn bg-violet-600 text-white rounded-xl py-2">Save PIN</button>
        <button id="pinClr" class="btn bg-slate-400 text-white rounded-xl py-2">Use math instead</button>
      </div>
    </section>
  </div>
</aside>

<script>
/* ---------- State (localStorage) ---------- */
const KEY='kidtube_v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.playlists)||!S.playlists.length)S={pin:'',cur:'p1',playlists:[{id:'p1',name:'Favorites',videos:[]}]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pl=()=>S.playlists.find(p=>p.id===S.cur)||(S.cur=S.playlists[0].id,S.playlists[0]);
const parseId=t=>{const m=t.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/)||t.match(/^([\w-]{11})$/);return m?m[1]:null};
async function getTitle(id){
  try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
    if(r.ok){const j=await r.json();if(j.title)return j.title}
    else if([401,403,404].includes(r.status))return null; /* embedding blocked, private or removed */
  }catch(e){}
  return 'Video '+id;
}

/* ---------- Player ---------- */
let idx=0,ready=false,player=null,errs=0,parentOpen=false;
const say=t=>{$('msg').textContent=t||''};
const ERR={2:'That video ID looks invalid.',5:'The player hit a problem. Try again.',100:'This video is private or was removed.',101:'The owner blocks this video from playing outside YouTube.',150:'The owner blocks this video from playing outside YouTube.',153:'YouTube could not verify this page. Open the https:// address, not a local file.'};
setTimeout(()=>{if(!ready)say('Player not loaded. An ad blocker or network filter may be blocking YouTube.')},6000);
window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('player',{width:'100%',height:'100%',
    playerVars:{controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,iv_load_policy:3,playsinline:1,cc_load_policy:0},
    events:{onReady:()=>{ready=true;say('');cue(false)},onStateChange:onState,onError:e=>{say((ERR[e.data]||'Error '+e.data)+' (code '+e.data+')');errs++;if(errs<=pl().videos.length)next()}}});
};
function cue(auto){
  if(!ready)return;
  const v=pl().videos[idx];
  if(!v){player.stopVideo();return}
  auto?player.loadVideoById(v.id):player.cueVideoById(v.id);
}
function go(i){const n=pl().videos.length;if(!n)return;idx=(i+n)%n;cue(true);render()}
const next=()=>go(idx+1);
function prev(){if(ready&&player.getCurrentTime()>3)player.seekTo(0,true);else go(idx-1)}
function seek(d){if(ready)player.seekTo(Math.max(0,player.getCurrentTime()+d),true)}
function toggle(){
  if(!ready){say('Player is still loading…');return}
  if(!pl().videos.length){say('No videos yet. Ask a grown-up to add some.');return}
  player.getPlayerState()===1?player.pauseVideo():player.playVideo();
}
function onState(e){
  const playing=e.data===1;
  if(playing){errs=0;say('')}
  $('bigPlay').style.opacity=(playing||e.data===3)?0:1;
  if(e.data===0)next();
}
setInterval(()=>{
  if(!ready)return;
  const d=player.getDuration();
  $('bar').style.width=d?Math.min(100,player.getCurrentTime()/d*100)+'%':'0';
},500);

function anim(c){const b=$('pbox');b.classList.remove('inU','inD');void b.offsetWidth;b.classList.add(c)}
(()=>{
  let sx=0,sy=0,down=false;const sh=$('shield');
  sh.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;down=true});
  sh.addEventListener('pointercancel',()=>{down=false});
  sh.addEventListener('pointerup',e=>{
    if(!down)return;down=false;
    const dx=e.clientX-sx,dy=e.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy);
    if(Math.max(ax,ay)<30){toggle();return}          // tap
    const nxt=ay>=ax?dy<0:dx<0;                       // up or left = next
    anim(nxt?'inU':'inD');
    nxt?next():go(idx-1);
  });
})();

/* ---------- Kids view ---------- */
function render(){
  const p=pl();
  $('chips').innerHTML=S.playlists.map(x=>`<button data-pl="${x.id}" class="btn shrink-0 px-3 py-1 rounded-full text-sm font-bold ${x.id===p.id?'bg-white text-violet-700':'bg-white/25 text-white'}">${esc(x.name)}</button>`).join('');
  $('list').innerHTML=p.videos.length?p.videos.map((v,i)=>`<button data-i="${i}" class="btn shrink-0 w-36 text-left" style="scroll-snap-align:start"><img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" class="w-36 h-20 rounded-xl object-cover bg-slate-200 ${i===idx?'ring-4 ring-yellow-300':''}"><span class="block mt-1 text-xs font-bold leading-tight line-clamp-2 ${i===idx?'text-yellow-200':'text-white'}">${esc(v.title)}</span></button>`).join('')
    :`<p class="text-white font-bold px-1 py-3">No videos yet 🙈 Ask a grown-up to add some!</p>`;
  const cur=$('list').querySelector(`[data-i="${idx}"]`);
  if(cur)$('list').scrollTo({left:Math.max(0,cur.offsetLeft-12),behavior:'smooth'});
  if(parentOpen)renderParent();
}
$('list').onclick=e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)};
$('chips').onclick=e=>{const b=e.target.closest('[data-pl]');if(b)switchPl(b.dataset.pl)};
function switchPl(id){S.cur=id;idx=0;save();cue(false);render()}

/* ---------- Gate (math or PIN) ---------- */
let gMode,gAns,buf='';
['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(k=>{
  const b=document.createElement('button');
  b.textContent=k;b.className='btn h-14 rounded-2xl text-2xl font-bold '+(k==='OK'?'bg-emerald-500 text-white':'bg-slate-100');
  b.onclick=()=>key(k);$('pad').appendChild(b);
});
function setGate(on){$('gate').classList.toggle('hidden',!on);$('gate').classList.toggle('flex',on)}
function showBuf(){$('gd').textContent=gMode==='pin'?'●'.repeat(buf.length):buf}
function openGate(){
  if(parentOpen){closePanel();return}
  buf='';
  if(S.pin){gMode='pin';$('gq').textContent='Enter your PIN'}
  else{const a=3+Math.floor(Math.random()*7),b=3+Math.floor(Math.random()*7);gMode='math';gAns=String(a*b);$('gq').textContent=`What is ${a} × ${b}?`}
  showBuf();setGate(true);
}
function key(k){
  if(k==='⌫')buf=buf.slice(0,-1);
  else if(k==='OK')return check();
  else if(buf.length<(gMode==='pin'?4:3))buf+=k;
  showBuf();
  if(gMode==='pin'&&buf.length===4)check();
}
function check(){
  if(buf===(gMode==='pin'?S.pin:gAns)){setGate(false);openPanel()}
  else{openGate();$('gq').textContent='Not quite. '+$('gq').textContent}
}
$('lockBtn').onclick=openGate;
$('gx').onclick=()=>setGate(false);

/* ---------- Parent panel ---------- */
function openPanel(){parentOpen=true;$('panel').classList.remove('translate-x-full');$('lockBtn').textContent='🔓';renderParent()}
function closePanel(){parentOpen=false;$('panel').classList.add('translate-x-full');$('lockBtn').textContent='🔒'}
$('lockOut').onclick=closePanel;

function renderParent(){
  $('plSel').innerHTML=S.playlists.map(p=>`<option value="${p.id}" ${p.id===S.cur?'selected':''}>${esc(p.name)} (${p.videos.length})</option>`).join('');
  const vs=pl().videos;
  $('vlist').innerHTML=vs.length?vs.map((v,i)=>`<div class="flex items-center gap-2 bg-white rounded-xl p-2 shadow-sm"><img src="https://i.ytimg.com/vi/${v.id}/default.jpg" alt="" class="w-16 aspect-video rounded object-cover bg-slate-200"><span class="flex-1 text-sm font-semibold leading-tight line-clamp-2">${esc(v.title)}</span><button data-a="up" data-i="${i}" class="btn px-1" aria-label="Move up">⬆️</button><button data-a="dn" data-i="${i}" class="btn px-1" aria-label="Move down">⬇️</button><button data-a="del" data-i="${i}" class="btn px-1" aria-label="Delete">🗑️</button></div>`).join('')
    :'<p class="text-sm text-slate-500">No videos yet. Paste a link above.</p>';
  $('pinState').textContent=S.pin?'A PIN is set. Parent Mode asks for it.':'No PIN set. Parent Mode asks a quick math question.';
}
$('addBtn').onclick=async()=>{
  const target=pl();
  const shorts={};
  const ids=[...new Set($('addTxt').value.split(/[\s,]+/).filter(Boolean).map(t=>{const id=parseId(t);if(id&&/\/shorts\//.test(t))shorts[id]=1;return id}).filter(Boolean))].filter(id=>!target.videos.some(v=>v.id===id));
  if(!ids.length){$('addMsg').textContent='No new YouTube links found. Paste video links (not playlist links).';return}
  $('addMsg').textContent='Adding…';
  const wasEmpty=!target.videos.length;
  let bad=0;
  for(const id of ids){const t=await getTitle(id);if(t===null){bad++;continue}target.videos.push({id,title:t,v:!!shorts[id]})}
  const ok=ids.length-bad;
  save();$('addTxt').value='';
  $('addMsg').textContent=`Added ${ok} video${ok===1?'':'s'}.`+(bad?` Skipped ${bad}: blocked from playing outside YouTube, private or removed.`:'');
  if(wasEmpty&&target===pl()){idx=0;cue(false)}
  render();
};
$('vlist').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const i=+b.dataset.i,vs=pl().videos,a=b.dataset.a;
  if(a==='del'){
    vs.splice(i,1);
    if(i<idx)idx--;
    else if(i===idx){idx=Math.min(idx,vs.length-1);if(idx<0)idx=0;cue(false)}
  }else{
    const j=a==='up'?i-1:i+1;
    if(j<0||j>=vs.length)return;
    [vs[i],vs[j]]=[vs[j],vs[i]];
    if(idx===i)idx=j;else if(idx===j)idx=i;
  }
  save();render();
};
$('plSel').onchange=e=>switchPl(e.target.value);
$('plNew').onclick=()=>{
  const n=prompt('Playlist name?');
  if(n&&n.trim()){const id='p'+Date.now();S.playlists.push({id,name:n.trim().slice(0,30),videos:[]});switchPl(id)}
};
$('plRen').onclick=()=>{
  const n=prompt('New name?',pl().name);
  if(n&&n.trim()){pl().name=n.trim().slice(0,30);save();render()}
};
$('plDel').onclick=()=>{
  if(S.playlists.length<2){alert('You need at least one playlist.');return}
  if(!confirm(`Delete "${pl().name}" and its videos?`))return;
  S.playlists=S.playlists.filter(p=>p.id!==S.cur);
  switchPl(S.playlists[0].id);
};
$('pinSave').onclick=()=>{
  const v=$('pinIn').value.trim();
  if(!/^\d{4}$/.test(v)){alert('PIN must be exactly 4 digits.');return}
  S.pin=v;save();$('pinIn').value='';renderParent();
};
$('pinClr').onclick=()=>{S.pin='';save();renderParent()};

/* ---------- Home-screen manifest (inline) ---------- */
try{
  const icon="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#5b21b6'/><text x='50' y='72' font-size='60' text-anchor='middle'>🎈</text></svg>");
  const m={name:'ZeynepsGarden',short_name:'ZeynepsGarden',display:'standalone',orientation:'portrait',start_url:location.href.split('#')[0],background_color:'#5b21b6',theme_color:'#5b21b6',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
  const l=document.createElement('link');l.rel='manifest';
  l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
  document.head.appendChild(l);
}catch(e){}

render();
</script>
<script src="https://www.youtube.com/iframe_api" onerror="document.getElementById('msg').textContent='Could not load the YouTube player. Check your connection or ad blocker.'"></script>
</body>
</html>
